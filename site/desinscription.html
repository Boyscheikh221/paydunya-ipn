<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Désinscription — licenceoff</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="64x64" href="/img/profil-64.png">
<style>
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:#FBF7EE; color:#0F2A6B; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; max-width:440px; width:100%; border-radius:16px; padding:28px 24px; box-shadow:0 6px 24px rgba(16,42,67,.12); text-align:center; }
  .logo { font-size:26px; font-weight:800; color:#1E4FB8; } .logo span { color:#F5A21B; }
  p { line-height:1.5; } a { color:#1E4FB8; font-weight:700; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">licence<span>off</span></div>
  <h1 id="t" style="font-size:20px">Un instant…</h1>
  <p id="m"></p>
  <p><a href="/">Retour au site</a></p>
</div>
<script>
(async () => {
  const t = new URLSearchParams(location.search).get("t") || "";
  const T = document.getElementById("t"), M = document.getElementById("m");
  try {
    const r = await fetch("https://vnzpxfoeiixiqxkhdnik.supabase.co/functions/v1/boutique", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "unsubscribe", t }) });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error();
    T.textContent = "Vous êtes désinscrit ✔";
    M.textContent = "L'adresse " + d.email + " ne recevra plus nos offres. Vous continuerez à recevoir les emails liés à vos commandes (clés, factures).";
  } catch (_) {
    T.textContent = "Lien invalide";
    M.textContent = "Ce lien de désinscription n'est pas reconnu. Écrivez-nous à contact@licenceoff.com et nous vous retirons de la liste.";
  }
})();
</script>
</body>
</html>
