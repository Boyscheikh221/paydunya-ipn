async function related(p) {
  try {
    const d = await LO.boutique({ action: "catalog" }); if (!d.products) return;
    const parentOf = Object.fromEntries(d.categories.map((c) => [c.slug, c.parent]));
    const fam = (s) => parentOf[s] || s;
    const names = Object.fromEntries(d.categories.map((c) => [c.slug, c.name]));
    const others = LO.listed(d.products).filter((x) => x.slug !== p.slug);
    const score = (x) => (x.category === p.category ? 4 : fam(x.category) === fam(p.category) ? 2 : 0) + (x.in_stock ? 1 : 0);
    const list = others.map((x) => [score(x), x]).filter(([s]) => s >= 2).sort((a, b) => b[0] - a[0]).map(([, x]) => x);
    const pick = (list.length >= 2 ? list : others.slice().sort((a, b) => (b.in_stock ? 1 : 0) - (a.in_stock ? 1 : 0))).slice(0, 4);
    if (!pick.length) return;
    const sec = $("#related");
    sec.replaceChildren(el("div", { class: "sec-title" }, el("h2", { text: "Vous aimerez aussi" })), el("div", { class: "grid" }, ...pick.map((x) => LO.productCard(x, names[x.category]))));
    sec.classList.remove("hidden");
  } catch (_) {}

    if (!LO.acct()) { LO.toast("Connectez-vous pour garder vos favoris"); setTimeout(() => (location.href = "/compte?retour=" + encodeURIComponent(location.pathname)), 900); return; }
    const d = await LO.boutique({ action: "fav", s: LO.acct(), slug: p.slug, set: !on }).catch(() => ({}));
    if (d.error === "non_connecte") { LO.setAcct(""); location.href = "/compte"; return; }

}

    const head = [el("h2", { text: "2. Les versions d'Office pour votre Mac" }),
      el("p", { class: "mac-chosen" }, "Votre Mac : ", el("b", { text: macTxt(m) }), " ", el("button", { type: "button", class: "linkbtn", text: "Modifier", onclick: () => go("") })),
      want && !wantOk ? el("p", { class: "mac-miss" }, svgI(I_WARN, 16), el("span", {}, el("b", { text: want.name }), " ne fonctionne pas sur " + macTxt(m) + "." + (list.length ? " Voici les versions qui fonctionnent sur votre Mac\u00a0:" : ""))) : null];
    if (!list.length) {
      box.replaceChildren(...head, el("div", { class: "mac-none" },
        el("p", {}, el("b", { text: "Aucune version d'Office vendue en ligne ne fonctionne bien sur ce Mac." })),
        el("p", { text: "Microsoft ne suit plus cette version de macOS. Si votre Mac le permet, mettez macOS à jour (menu Pomme > Préférences Système > Mise à jour de logiciels), puis revenez. Sinon, écrivez-nous : nous cherchons la meilleure solution avec vous." }),
        el("a", { class: "btn wa-go", href: wa("Bonjour, je veux Office pour Mac. Mon Mac : " + macTxt(m) + ". Quelle version me conseillez-vous ?"), target: "_blank", rel: "noopener" }, svgI(LO.ICONS.wa, 18), "Nous écrire sur WhatsApp", el("span", { class: "sr-only", text: " (ouvre WhatsApp)" }))));
      return;
    }
    box.replaceChildren(...head, el("div", { class: "mac-vers", role: "list", "aria-label": "Versions compatibles" }, ...list.map(({ p: x, ok }) => {
      const online = payMode !== "whatsapp" && ok && x.in_stock;
      const msg = "Bonjour, je veux commander " + x.name + " à " + fcfa(x.price_fcfa) + ". Mon Mac : " + macTxt(m) + "." + (ok ? "" : " Pouvez-vous confirmer que c'est compatible avec mon Mac ?");
      const off = x.compare_price_fcfa && x.compare_price_fcfa > x.price_fcfa;
      return el("div", { class: "mac-ver" + (ok ? "" : " risk"), role: "listitem" },
        el("div", { class: "mv-img" }, x.image_url ? el("img", { src: x.image_url, alt: "", loading: "lazy" }) : el("span", { class: "ph", text: LO.initials(x.name) })),
        el("div", { class: "mv-body" },
          el("b", { class: "mv-name", text: x.name }),
          x.slug === wanted && list.length > 1 ? el("span", { class: "mv-was", text: "La version que vous regardiez" }) : null,
          el("span", { class: "mv-tag" }, svgI(ok ? I_OK : I_WARN, 15), el("span", { text: ok ? "Compatible avec votre Mac"
            : MAC.recent.includes(m.id) ? "À vérifier : cette version d'Office n'est plus mise à jour par Microsoft. Nous vérifions avec vous sur WhatsApp qu'elle s'active bien sur votre Mac."
            : "À vérifier : votre macOS n'est plus suivi par Microsoft. Office s'installe avec une version plus ancienne, sans mises à jour. Nous vérifions avec vous sur WhatsApp." })),
          el("div", { class: "price" }, fcfa(x.price_fcfa), off ? el("s", { text: fcfa(x.compare_price_fcfa) }) : null)),
        // ---- étape 3 : paiement en ligne si le site l'accepte, sinon WhatsApp avec le message déjà écrit ----
        online ? el("button", { type: "button", class: "btn orange", text: "Choisir et payer", onclick: () => { LO.addToCart(x, 1); location.href = LO.url.cart; } })
          : el("a", { class: "btn wa-go", href: wa(msg), target: "_blank", rel: "noopener", onclick: () => { stepOn(3); LO.px("Contact", { content_name: x.name, value: x.price_fcfa, currency: "XOF" }, null, true); } },
              svgI(LO.ICONS.wa, 18), "Commander sur WhatsApp", el("span", { class: "sr-only", text: " (ouvre WhatsApp)" })));
    })),
      el("p", { class: "note", style: "margin-top:10px", text: payMode === "whatsapp" ? "Vous arrivez sur notre WhatsApp avec votre choix et le prix déjà écrits : il suffit d'envoyer le message, nous vous répondons pour le paiement (Wave ou Orange Money)." : "Paiement sécurisé à l'étape suivante." }));
  }
}

if (!slug) location.replace(LO.url.shop);
LO.boutique({ action: "product", slug }).then((d) => {
  if (d.product && d.product.slug === MAC.chooser) { showMac(d.product); LO.track("view", { slug: d.product.slug });
    LO.px("ViewContent", { content_ids: [d.product.slug], content_type: "product", content_name: d.product.name, currency: "XOF" }); }
  else if (d.product) { show(d.product); LO.track("view", { slug: d.product.slug });
    LO.px("ViewContent", { content_ids: [d.product.slug], content_type: "product", content_name: d.product.name, value: d.product.price_fcfa, currency: "XOF" }); }
  else $("#view").replaceChildren(el("div", { class: "empty" }, el("h1", { text: "Produit introuvable" }), el("p", { text: "Ce produit n'existe plus ou a changé d'adresse." }), el("a", { class: "btn", href: LO.url.shop, text: "Retour à la boutique" })));
}).catch(() => $("#view").replaceChildren(el("div", { class: "empty", text: "Erreur de chargement. Réessayez dans un instant." })));
</script>
</body>
</html>
