<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique — licenceoff</title>
<meta name="description" content="Tous nos produits : licences Windows, Microsoft Office, logiciels et services informatiques. Livraison immédiate au Sénégal.">
<meta name="theme-color" content="#1E4FB8">
<link rel="stylesheet" href="/shop.css?v=5">
</head>
<body>
<main class="wrap">
  <div id="crumbs"></div>
  <div class="sec-title" style="margin-top:6px"><h1 id="catTitle" style="margin:0;font-size:28px">Boutique</h1><span id="count" class="note"></span></div>
  <p id="catIntro" class="note" style="margin:6px 0 14px"></p>
  <nav id="chips" aria-label="Catégories"></nav>
  <div id="grid" class="grid" style="margin:14px 0 30px">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>
<script src="/shop.js?v=5"></script>
<script>
LO.page("shop");
const { el, $, url } = LO;
// /boutique = tous les produits ; /categorie/licences-windows = une catégorie
const current = LO.slugFromPath("categorie", "c");
const query = (new URLSearchParams(location.search).get("q") || "").trim();

function render(data) {
  const cats = data.categories;
  const bySlug = Object.fromEntries(cats.map((c) => [c.slug, c]));
  const names = Object.fromEntries(cats.map((c) => [c.slug, c.name]));
  const cat = bySlug[current];
  const parent = cat && cat.parent ? bySlug[cat.parent] : null;
  const catUrl = (c) => LO.url.category(c.slug, c.parent);
  if (current && !cat) {
    $("#crumbs").replaceChildren(LO.crumbs([["Accueil", url.home], ["Boutique", url.shop], ["Catégorie introuvable"]]));
    $("#catTitle").textContent = "Catégorie introuvable";
    $("#grid").replaceChildren(el("div", { class: "empty" }, el("p", { text: "Cette catégorie n'existe plus." }), el("a", { class: "btn", href: url.shop, text: "Voir tous les produits" })));
    return;
  }
  // produits de la catégorie + de ses sous-catégories
  const children = cat ? cats.filter((c) => c.parent === cat.slug) : [];
  const inCat = new Set(cat ? [cat.slug, ...children.map((c) => c.slug)] : []);
  const hasProducts = (c) => data.products.some((p) => p.category === c.slug || cats.some((k) => k.parent === c.slug && k.slug === p.category));
  LO.seo({
    title: (cat ? cat.name : "Boutique") + " — licenceoff",
    description: cat ? (cat.description || cat.name + " : achat en ligne, livraison immédiate au Sénégal.") : "Tous nos produits : licences Windows, Microsoft Office, logiciels et solutions PC. Livraison immédiate au Sénégal.",
    path: query ? null : cat ? catUrl(cat) : url.shop,
  });
  $("#crumbs").replaceChildren(LO.crumbs([["Accueil", url.home], ["Boutique", url.shop], ...(parent ? [[parent.name, catUrl(parent)]] : []), ...(cat ? [[cat.name]] : [])].map((x, i, arr) => i === arr.length - 1 ? [x[0]] : x)));
  $("#catTitle").textContent = query ? "Résultats pour « " + query + " »" : cat ? cat.name : "Tous les produits";
  $("#catIntro").textContent = cat ? (cat.description || "") : "";
  // ligne 1 : catégories principales ; ligne 2 : sous-catégories de la catégorie choisie
  const top = parent || cat;
  const mains = LO.mainCats(data);
  const subs = top ? cats.filter((c) => c.parent === top.slug && hasProducts(c)) : [];
  $("#chips").replaceChildren(
    el("div", { class: "chips" }, el("a", { class: "chip" + (cat ? "" : " on"), href: url.shop, text: "Tout" }),
      ...mains.map((c) => el("a", { class: "chip" + (top && top.slug === c.slug ? " on" : ""), href: catUrl(c), text: c.name }))),
    subs.length ? el("div", { class: "chips sub" }, el("a", { class: "chip" + (cat && !parent ? " on" : ""), href: catUrl(top), text: "Tout " + top.name }),
      ...subs.map((c) => el("a", { class: "chip" + (current === c.slug ? " on" : ""), href: catUrl(c), text: c.name }))) : null);
  let list = data.products.filter((p) => !cat || inCat.has(p.category));
  if (query) { const q = query.toLowerCase(); list = list.filter((p) => (p.name + " " + p.description).toLowerCase().includes(q)); }
  $("#count").textContent = list.length + " produit" + (list.length > 1 ? "s" : "");
  const grid = $("#grid");
  grid.replaceChildren(...list.map((p) => LO.productCard(p, names[p.category])));
  if (!list.length) grid.append(el("div", { class: "empty" }, el("p", { text: query ? "Aucun produit ne correspond à votre recherche." : "Aucun produit dans cette catégorie pour le moment." }),
    el("a", { class: "btn", href: url.shop, text: "Voir tous les produits" })));
}

LO.boutique({ action: "catalog" }).then((d) => { if (d.products) render(d); else throw 0; })
  .catch(() => $("#grid").replaceChildren(el("div", { class: "empty", text: "Impossible de charger les produits. Réessayez dans un instant." })));
</script>
</body>
</html>
