<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Téléchargement Office — licenceoff.com</title>
<style>
  :root { --bleu:#1E4FB8; --bleu-nuit:#0F2A6B; --orange:#F5A21B; --creme:#FBF7EE; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--creme); color: var(--bleu-nuit); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; max-width:440px; width:100%; border-radius:16px; padding:28px 24px;
          box-shadow:0 6px 24px rgba(16,42,67,.12); text-align:center; }
  .logo { font-size:26px; font-weight:800; margin-bottom:4px; }
  .logo .a { color: var(--bleu); } .logo .b { color: var(--orange); } .logo .c { color: var(--bleu); font-size:.55em; }
  .sub { font-size:13px; opacity:.7; margin-bottom:22px; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { line-height:1.5; margin:8px 0; }
  button { background: var(--bleu); color:#fff; border:0; border-radius:10px; padding:14px 22px;
           font-size:16px; font-weight:700; cursor:pointer; width:100%; margin-top:14px; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  a.wa { display:inline-block; margin-top:14px; background: var(--orange); color:#fff; text-decoration:none;
         border-radius:10px; padding:12px 18px; font-weight:700; }
  .note { font-size:13px; opacity:.75; margin-top:16px; }
  .ok { color:#15803d; } .ko { color:#b91c1c; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="64x64" href="/img/profil-64.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:image" content="https://www.licenceoff.com/img/partage.jpg">
</head>
<body>
<div class="card">
  <div class="logo"><span class="a">licence</span><span class="b">off</span><span class="c">.com</span></div>
  <div class="sub">Licences &amp; solutions numériques</div>
  <div id="content"><p>Vérification de votre lien…</p></div>
</div>

<script>
// ====== À MODIFIER ======
const FUNCTION_URL = "https://vnzpxfoeiixiqxkhdnik.supabase.co/functions/v1/download";
const WHATSAPP_NUMBER = "221777860777"; // sans le +
// ========================

const token = new URLSearchParams(location.search).get("t") || "";
const box = document.getElementById("content");

const MESSAGES = {
  pending:   ["Lien pas encore activé", "Votre lien sera activé dès que votre commande est confirmée. Contactez-nous sur WhatsApp."],
  expired:   ["Lien expiré", "Ce lien n'est plus valable. Contactez-nous sur WhatsApp pour en recevoir un nouveau."],
  limit:     ["Limite de téléchargements atteinte", "Ce lien a déjà été utilisé. Contactez-nous sur WhatsApp si vous avez besoin d'un nouveau lien."],
  revoked:   ["Lien désactivé", "Ce lien n'est plus actif. Contactez-nous sur WhatsApp."],
  not_found: ["Lien invalide", "Vérifiez que vous avez copié le lien en entier, ou contactez-nous sur WhatsApp."],
  error:     ["Erreur temporaire", "Une erreur est survenue. Réessayez dans un instant, ou contactez-nous sur WhatsApp."],
};

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function showProblem(reason) {
  const [title, text] = MESSAGES[reason] || MESSAGES.error;
  box.replaceChildren();
  box.append(el("h1", title, "ko"), el("p", text));
  const a = el("a", "Écrire sur WhatsApp", "wa");
  a.href = "https://wa.me/" + WHATSAPP_NUMBER;
  box.append(a);
}

function showReady() {
  box.replaceChildren();
  const btn = el("button", "Télécharger Office");
  box.append(
    el("h1", "Votre téléchargement est prêt", "ok"),
    el("p", "Cliquez sur le bouton ci-dessous. Ce lien est personnel et ne fonctionne qu'une seule fois."),
    btn,
    el("p", "Après le téléchargement, lancez le fichier pour installer Office. Votre clé d'activation vous sera envoyée par email.", "note"),
    el("p", "Le téléchargement ne démarre pas ou s'arrête ? Recliquez sur le bouton : c'est possible pendant 30 minutes. Si Windows ou l'antivirus affiche un avertissement, choisissez « Conserver » puis « Exécuter quand même » : le fichier est le programme d'installation officiel.", "note"),
  );
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "Préparation…";
    try {
      const r = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ t: token }),
      });
      const d = await r.json();
      if (d.ok && d.url) {
        btn.textContent = "Téléchargement lancé ✔ (recliquer si besoin)";
        btn.disabled = false;
        window.location.href = d.url;
      } else {
        showProblem(d.reason);
      }
    } catch (_) {
      showProblem("error");
    }
  });
}

(async () => {
  if (!token) return showProblem("not_found");
  try {
    const r = await fetch(FUNCTION_URL + "?t=" + encodeURIComponent(token));
    const d = await r.json();
    d.ok ? showReady() : showProblem(d.reason);
  } catch (_) {
    showProblem("error");
  }
})();
</script>
</body>
</html>
