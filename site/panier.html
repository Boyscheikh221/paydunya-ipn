<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon panier — licenceoff.com</title>
<link rel="stylesheet" href="/shop.css?v=34">
<style>.line-warn { color: #b91c1c; font-weight: 700; font-size: 14px; margin-top: 2px; } .line .rm { min-height: 44px; padding: 0 8px; }</style>
<link rel="icon" type="image/png" sizes="192x192" href="/img/profil-192.png"><link rel="icon" type="image/png" sizes="48x48" href="/img/profil-48.png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:image" content="https://www.licenceoff.com/img/partage.jpg">
</head>
<body>
<main class="wrap">
  <div data-crumbs='[["Accueil","/"],["Boutique","/boutique"],["Mon panier"]]' style="margin-top:14px"></div>
  <h1 style="margin:24px 0 0">Mon panier</h1>
  <div id="view"></div>
</main>
<script src="/shop.js?v=34"></script>
<script>
LO.page("shop");
const { el, $, fcfa } = LO;
const ERR = {
  nom_invalide: "Indiquez votre nom complet.",
  email_invalide: "Adresse email invalide.",
  telephone_invalide: "Numéro WhatsApp invalide.",
  panier_vide: "Votre panier est vide.",
  produit_introuvable: "Un produit de votre panier n'est plus disponible. Retirez-le et réessayez.",
  livraison_manquante: "Choisissez un mode de livraison.",
  adresse_manquante: "Indiquez votre adresse de livraison.",
  telephone_senegal: "Pour la livraison, indiquez un numéro sénégalais (+221), ex : +221 77 123 45 67.",
  trop_de_commandes: "Vous avez déjà plusieurs commandes en attente. Contactez-nous sur WhatsApp.",
  points_compte: "Pour utiliser vos points, gardez l'email de votre compte client.",
  points_insuffisants: "Votre solde de points a changé. Rechargez la page et réessayez.",
};
// points fidélité (client connecté à son compte) : 1 point par 1 000 F, 1 point = 10 F de réduction dès 200 points
let pq = null, usePts = false;
async function loadPoints() {
  const items = LO.cart(); pq = null;
  if (!items.length || !LO.acct()) return;
  try { pq = await LO.boutique({ action: "points_quote", s: LO.acct(), items: items.map((i) => ({ slug: i.slug, qty: i.qty })), ref: quote.code || "" }); } catch (_) {}
  if (!pq || !pq.usable) usePts = false;
}
const ptsDiscount = () => (usePts && pq && pq.usable ? pq.discount : 0);
// prix avec le code parrain (calculés par le serveur, recalculés à la commande)
let quote = { code: null, discount_pct: 0, prices: {} };
const priceOf = (i) => quote.prices[i.slug] ?? i.price;
async function loadQuote(code) {
  const items = LO.cart();
  if (!items.length) { quote = { code: null, discount_pct: 0, prices: {} }; return null; }
  try {
    const d = await LO.boutique({ action: "quote", code: code || "", slugs: items.map((i) => i.slug) });
    // prix du moment (une promo a pu commencer ou finir depuis l'ajout au panier)
    if (d.list) { let ch = false; for (const i of items) if (d.list[i.slug] != null && d.list[i.slug] !== i.price) { i.price = d.list[i.slug]; ch = true; } if (ch) LO.saveCart(items); }
    quote = d.code ? d : { code: null, discount_pct: 0, prices: {} }; return d.code;
  }
  catch (_) { return null; }
}

// disponibilité réelle : un produit retiré de la boutique ou en rupture ne peut pas être commandé
let avail = null; // slug -> { in_stock, max }
async function loadAvail() {
  const items = LO.cart(); if (!items.length) return;
  try {
    const d = await LO.boutique({ action: "catalog" }); if (!d.products) return;
    avail = Object.fromEntries(d.products.map((p) => [p.slug, { in_stock: p.in_stock, max: p.max_qty, image: p.image_url, name: p.name }]));
    let ch = false;
    for (const i of items) { const a = avail[i.slug]; if (!a) continue;
      if (a.image && i.image !== a.image) { i.image = a.image; ch = true; }
      if (a.max && i.max !== a.max) { i.max = a.max; if (i.qty > a.max) i.qty = a.max; ch = true; } }
    if (ch) LO.saveCart(items);
  } catch (_) {}
}
const unavail = (i) => (avail ? (!avail[i.slug] ? "gone" : !avail[i.slug].in_stock ? "out" : "") : "");

// produits physiques : livraison dans Dakar (domicile ou bus) ; hors Dakar, le client nous écrit sur WhatsApp
let cinfo = { physical: [], shipping: { home: 1500, bus: 1000 } };
const ship = { method: "home", address: "", zone: "", lat: null, lng: null };
async function loadCartInfo() {
  const items = LO.cart(); if (!items.length) return;
  try { const d = await LO.boutique({ action: "cart_info", slugs: items.map((i) => i.slug) }); if (d.shipping) cinfo = d; } catch (_) {}
}
// mode « WhatsApp » (page Paiements de l'admin) : email + WhatsApp seulement, puis le client finalise sur WhatsApp
const waMode = () => (cinfo.pay_mode || "whatsapp") === "whatsapp";
const hasPhysical = () => LO.cart().some((i) => cinfo.physical.includes(i.slug));
const shipFee = () => hasPhysical() && ship.method !== "out" ? Number(cinfo.shipping[ship.method] || 0) : 0;

function shipBox(update) {
  const opt = (v, title, sub) => {
    const inp = el("input", { type: "radio", name: "ship", value: v });
    inp.checked = ship.method === v;
    inp.addEventListener("change", () => { ship.method = v; sync(); update(); });
    return el("label", { class: "ship-opt" }, inp, el("span", {}, el("b", { text: title }), el("span", { class: "note", text: sub })));
  };
  const addr = el("textarea", { class: "field", rows: "2", placeholder: "Rue, immeuble, point de repère…", maxlength: "300" }); addr.value = ship.address;
  addr.addEventListener("input", () => { ship.address = addr.value; });
  const zone = el("input", { class: "field", placeholder: "ex : Médina, Parcelles, Almadies…", maxlength: "80" }); zone.value = ship.zone;
  zone.addEventListener("input", () => { ship.zone = zone.value; });
  const posInfo = el("span", { class: "note", text: ship.lat != null ? "Position enregistrée ✔" : "" });
  const posBtn = el("button", { class: "btn light", type: "button", style: "margin-top:8px", text: "Partager ma position" });
  posBtn.addEventListener("click", () => {
    if (!navigator.geolocation) { posInfo.textContent = "Votre téléphone ne permet pas de partager la position. Écrivez bien l'adresse."; return; }
    posBtn.disabled = true; posInfo.textContent = "Recherche de votre position…";
    navigator.geolocation.getCurrentPosition(
      (p) => { ship.lat = p.coords.latitude; ship.lng = p.coords.longitude; posBtn.disabled = false; posInfo.textContent = "Position enregistrée (le livreur trouvera plus facilement)"; },
      () => { posBtn.disabled = false; posInfo.textContent = "Position non partagée. Ce n'est pas grave : l'adresse suffit."; },
      { enableHighAccuracy: true, timeout: 15000 });
  });
  const fields = el("div", {}, el("label", { text: "Adresse de livraison" }), addr, el("label", { text: "Quartier" }), zone,
    el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, posBtn, posInfo),
    el("p", { class: "note", style: "margin:6px 0 0", text: "Votre position sert uniquement à la livraison, si vous l'acceptez." }));
  const out = el("div", { class: "note", style: "margin-top:8px" }, "Pour une livraison hors de Dakar, écrivez-nous : nous trouverons ensemble le meilleur moyen de vous envoyer le colis. ",
    el("a", { class: "btn", style: "margin-top:8px", href: "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Bonjour, je souhaite commander (" + LO.cart().map((i) => i.qty + " × " + i.name).join(", ") + ") avec une livraison hors de Dakar."), target: "_blank", rel: "noopener", text: "Contacter l'assistance sur WhatsApp" }));
  const sync = () => { fields.classList.toggle("hidden", ship.method === "out"); out.classList.toggle("hidden", ship.method !== "out"); };
  sync();
  return el("div", { class: "ship-box" }, el("h2", { style: "margin:18px 0 6px;font-size:18px", text: "Livraison" }),
    opt("home", "À domicile dans Dakar", "à partir de " + fcfa(cinfo.shipping.home)),
    opt("bus", "Envoi par bus dans Dakar", fcfa(cinfo.shipping.bus)),
    opt("out", "Hors de Dakar", "on s'organise ensemble sur WhatsApp"),
    fields, out);
}

function render() {
  const items = LO.cart();
  const view = $("#view");
  if (!items.length) {
    view.replaceChildren(el("div", { class: "panel empty", style: "margin:24px 0" },
      el("p", { text: "Votre panier est vide." }), el("a", { class: "btn", href: LO.url.shop, text: "Découvrir la boutique" })));
    return;
  }
  const ok = (i) => !unavail(i);
  const total = items.filter(ok).reduce((s, i) => s + priceOf(i) * i.qty, 0);
  const listTotal = items.filter(ok).reduce((s, i) => s + i.price * i.qty, 0);
  const lines = items.map((i, idx) => {
    const q = el("input", { type: "number", min: "1", max: String(i.max || 20), value: String(i.qty), "aria-label": "Quantité" });
    const setQ = (n) => { const all = LO.cart(); all[idx].qty = Math.max(1, Math.min(i.max || 20, Math.floor(n) || 1)); LO.saveCart(all); rerender(); };
    q.addEventListener("change", () => setQ(Number(q.value)));
    return el("div", { class: "line" },
      el("a", { class: "th", href: LO.url.product(i.slug) }, i.image ? el("img", { src: i.image, alt: "" }) : LO.initials(i.name)),
      el("div", {},
        el("a", { class: "nm", href: LO.url.product(i.slug), style: "color:inherit", text: i.name }),
        unavail(i) ? el("div", { class: "line-warn", text: unavail(i) === "gone" ? "Ce produit n'est plus vendu. Retirez-le du panier." : "En rupture de stock. Retirez-le ou écrivez-nous sur WhatsApp." })
          : el("div", { class: "note" }, priceOf(i) < i.price ? el("s", { text: fcfa(i.price), style: "margin-right:6px" }) : null, fcfa(priceOf(i)) + " l'unité"),
        el("div", { style: "display:flex;gap:12px;align-items:center;margin-top:6px" },
          el("div", { class: "qty" },
            el("button", { type: "button", text: "−", onclick: () => setQ(i.qty - 1) }), q, el("button", { type: "button", text: "+", onclick: () => setQ(i.qty + 1) })),
          el("button", { class: "rm", text: "Retirer", onclick: () => { const all = LO.cart(); all.splice(idx, 1); LO.saveCart(all); rerender(); } }))),
      el("strong", { style: unavail(i) ? "text-decoration:line-through;color:#94a3b8" : "", text: fcfa(priceOf(i) * i.qty) }));
  });
  const blocked = items.some((i) => unavail(i));

  const f = (id, label, type, ac, ph) => [el("label", { for: id, text: label }), el("input", { id, class: "field", type, autocomplete: ac, placeholder: ph })];
  const msg = el("div", { class: "msg" });
  const go = el("button", { class: "btn orange block", style: "margin-top:16px" });
  const feeLine = el("div", { class: "note", style: "margin-top:12px;display:flex;justify-content:space-between" });
  const totVal = el("span");
  const ptsLine = el("div", { class: "note", style: "margin-top:12px;display:flex;justify-content:space-between;color:#15803d;font-weight:700" });
  const earnLine = el("p", { class: "note", style: "margin:8px 0 0" });
  const update = () => {
    const fee = shipFee();
    feeLine.replaceChildren(el("span", { text: "Livraison" + (ship.method === "home" ? " à domicile" : ship.method === "bus" ? " par bus" : "") }), el("span", { text: fee ? fcfa(fee) : "—" }));
    feeLine.classList.toggle("hidden", !hasPhysical());
    const pd = ptsDiscount(), pay = total - pd + fee;
    ptsLine.replaceChildren(el("span", { text: "Points fidélité (" + (pq ? pq.usable : 0) + " points)" }), el("span", { text: "− " + fcfa(pd) }));
    ptsLine.classList.toggle("hidden", !pd);
    earnLine.textContent = "Cette commande vous rapportera " + Math.floor((total - pd) / 1000) + " point(s) fidélité, crédités à la livraison.";
    totVal.textContent = fcfa(pay);
    go.textContent = waMode() ? "Commander · " + fcfa(pay) : "Commander et payer " + fcfa(pay);
    go.classList.toggle("hidden", hasPhysical() && ship.method === "out");
    if (blocked) { go.disabled = true; go.textContent = "Retirez les produits indisponibles"; }
  };
  go.addEventListener("click", async () => {
    msg.textContent = "";
    if (blocked) return;
    // livraison : nom, adresse et numéro sénégalais obligatoires
    if (hasPhysical()) {
      if (!$("#name") || $("#name").value.trim().length < 2) { msg.textContent = ERR.nom_invalide; return $("#name") && $("#name").focus(); }
      let d = $("#phone").value.replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.length === 9) d = "221" + d;
      if (!/^221(7[05678]|3[03])\d{7}$/.test(d)) { msg.textContent = ERR.telephone_senegal; return $("#phone").focus(); }
    }
    if (ptsDiscount() && $("#email").value.trim().toLowerCase() !== pq.email) { msg.textContent = ERR.points_compte + " (" + pq.email + ")"; return $("#email").focus(); }
    go.disabled = true; go.textContent = "Création de la commande…";
    try {
      const d = await LO.boutique({
        action: "create_order", items: LO.cart().map((i) => ({ slug: i.slug, qty: i.qty })),
        name: $("#name") ? $("#name").value : "", email: $("#email").value, phone: $("#phone").value, website: $("#website").value, ref: quote.code || "", origin: LO.source(), marketing: !!($("#mkt") && $("#mkt").checked),
        use_points: !!ptsDiscount(), s: ptsDiscount() ? LO.acct() : undefined,
        shipping: hasPhysical() ? { method: ship.method, address: ship.address, zone: ship.zone, lat: ship.lat, lng: ship.lng } : undefined,
      });
      if (d.token) {
        LO.saveCart([]);
        location.href = "/commande?o=" + encodeURIComponent(d.token) + (d.wa ? "&wa=1" : "&pay=1");
        return;
      }
      msg.textContent = d.error === "stock_insuffisant"
        ? "Stock insuffisant pour « " + d.product + " » : il en reste " + d.left + ". Modifiez la quantité."
        : ERR[d.error] || "Erreur, réessayez dans un instant.";
    } catch (_) { msg.textContent = "Erreur de connexion, réessayez."; }
    go.disabled = blocked; update();
  });

  view.replaceChildren(el("div", { class: "two" },
    el("div", { class: "panel" }, ...lines),
    el("div", { class: "panel" },
      el("h2", { style: "margin:0 0 4px;font-size:18px", text: "Vos coordonnées" }),
      el("p", { class: "note", text: waMode() ? "Indiquez votre email et votre numéro WhatsApp. Votre commande est enregistrée, puis WhatsApp s'ouvre avec un message déjà prêt pour finaliser avec nous." : hasPhysical() ? "Après paiement, nous vous contactons sur WhatsApp pour la livraison. Vos clés et liens éventuels s'affichent sur votre page de commande." : "Après paiement, votre clé et vos liens s'affichent sur votre page de commande." }),
      // nom demandé ici seulement pour une livraison ; sinon une seule fois, au moment de voir la clé
      ...(hasPhysical() ? f("name", "Nom complet (pour la livraison)", "text", "name", "ex : Moussa Diop") : []),
      ...f("email", "Email", "email", "email", "vous@exemple.com"),
      ...(hasPhysical() ? f("phone", "Téléphone pour la livraison (Sénégal +221, obligatoire)", "tel", "tel", "+221 77 123 45 67") : f("phone", "Numéro WhatsApp", "tel", "tel", "ex : 77 123 45 67")),
      el("input", { id: "website", class: "hp", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" }),
      el("label", { class: "note", style: "display:flex;gap:8px;align-items:flex-start;margin-top:10px;cursor:pointer" },
        el("input", { id: "mkt", type: "checkbox", style: "margin-top:3px" }), "Je souhaite recevoir les offres et nouveautés licenceoff.com par email (désinscription en un clic)."),
      hasPhysical() ? shipBox(update) : null,
      codeBox(),
      pointsBox(update),
      listTotal > total ? el("div", { class: "note", style: "margin-top:12px;display:flex;justify-content:space-between" }, el("span", { text: "Remise parrain (" + quote.code + ")" }), el("span", { text: "− " + fcfa(listTotal - total) })) : null,
      ptsLine, feeLine,
      el("div", { class: "tot", style: "margin-top:8px" }, el("span", { text: "Total" }), totVal),
      earnLine, go, msg,
      el("p", { class: "note", style: "margin-top:12px", text: waMode() ? "Paiement par Wave ou Orange Money, finalisé avec nous sur WhatsApp. Votre clé s'affiche sur votre page de commande dès le paiement confirmé." : "🔒 Paiement sécurisé par PayDunya : Wave, Orange Money, Free Money ou carte." }))));
  // client connecté : son email est déjà rempli
  if (pq && pq.logged && !$("#email").value) { $("#email").value = pq.email; if (!$("#phone").value && pq.phone) $("#phone").value = pq.phone; }
  update();
}
// le panier change : les points utilisables sont recalculés par le serveur
async function rerender() { render(); if (LO.acct()) { await loadPoints(); render(); } }
function pointsBox(update) {
  const box = el("div", { class: "pts-box" });
  if (!pq || !pq.logged) {
    box.append(el("b", { text: "Programme de fidélité" }), el("p", { class: "note", style: "margin:4px 0 0" },
      "Chaque achat et chaque avis vous rapportent des points, à utiliser en réduction. Déjà des points ? ",
      el("a", { href: "/compte?retour=" + encodeURIComponent("/panier"), text: "Connectez-vous à votre compte" }), " pour les utiliser."));
    return box;
  }
  if (!pq.usable) {
    box.append(el("b", { text: "Vos points fidélité : " + pq.balance }), el("p", { class: "note", style: "margin:4px 0 0",
      text: pq.balance < pq.min ? "Utilisables dès " + pq.min + " points (" + fcfa(pq.min * pq.value) + " de réduction). Encore " + (pq.min - pq.balance) + " points à gagner !" : "Pas de réduction possible sur ce panier." }));
    return box;
  }
  const cb = el("input", { type: "checkbox", style: "margin-top:3px;width:18px;height:18px" }); cb.checked = usePts;
  cb.addEventListener("change", () => { usePts = cb.checked; update(); });
  box.append(el("label", { style: "display:flex;gap:10px;align-items:flex-start;cursor:pointer" }, cb,
    el("span", {}, el("b", { text: "Utiliser mes points : − " + fcfa(pq.discount) }),
      el("span", { class: "note", style: "display:block", text: pq.usable + " points utilisés sur " + pq.balance + " (1 point = " + pq.value + " F, réduction limitée à 20 % de la commande)." }))));
  return box;
}
function codeBox() {
  const box = el("details", { style: "margin-top:14px", open: quote.code ? "" : null }, el("summary", { style: "cursor:pointer;font-weight:700", text: quote.code ? "Code parrain : " + quote.code + " (-" + quote.discount_pct + " %)" : "Vous avez un code parrain ?" }));
  const inp = el("input", { class: "field", placeholder: "ex : AMADOU", value: quote.code || "", style: "text-transform:uppercase" });
  const info = el("div", { class: "note" });
  const ok = el("button", { class: "btn light", type: "button", style: "margin-top:8px", text: "Appliquer" });
  ok.addEventListener("click", async () => {
    const c = inp.value.trim().toUpperCase();
    const got = await loadQuote(c);
    if (c && !got) { info.textContent = "Ce code n'existe pas ou n'est plus actif."; return; }
    LO.setRef(got || ""); await loadPoints(); render();
  });
  box.append(inp, ok, info);
  if (quote.code) box.append(el("button", { class: "rm", type: "button", text: "Retirer le code", onclick: async () => { LO.setRef(""); quote = { code: null, discount_pct: 0, prices: {} }; await loadPoints(); render(); } }));
  return box;
}
render();
update0();
async function update0() { await Promise.all([loadCartInfo(), loadQuote(LO.refCode()), loadAvail()]); await loadPoints(); render(); }
</script>
</body>
</html>
