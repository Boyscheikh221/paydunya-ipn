<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions fréquentes — licenceoff.com</title>
<meta name="description" content="Livraison, paiement, téléchargement, activation : toutes les réponses à vos questions.">
<link rel="stylesheet" href="/shop.css?v=31">
<style>
  .faq details { background:#fff; border:1px solid var(--ligne); border-radius:12px; margin-bottom:10px; }
  .faq summary { cursor:pointer; padding:16px 18px; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:12px; }
  .faq summary::-webkit-details-marker { display:none; }
  .faq summary::after { content:"+"; font-size:22px; line-height:1; color:var(--bleu); }
  .faq details[open] summary::after { content:"−"; }
  .faq .a { padding:0 18px 16px; white-space:pre-line; line-height:1.65; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="64x64" href="/img/profil-64.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:image" content="https://www.licenceoff.com/img/partage.jpg">
</head>
<body>
<main class="wrap" style="max-width:820px">
  <div id="crumbs"></div>
  <section class="block" style="padding-top:8px">
    <h1 style="margin:0 0 6px">Questions fréquentes</h1>
    <p class="note" style="margin:0 0 18px">Vous ne trouvez pas votre réponse ? Écrivez-nous sur WhatsApp.</p>
    <div id="faq" class="faq"><div class="skeleton" style="min-height:120px"></div></div>
  </section>
</main>
<script src="/shop.js?v=31"></script>
<script>
LO.page("faq");
const { el, $ } = LO;
LO.seo({ path: LO.url.faq });
$("#crumbs").replaceChildren(LO.crumbs([["Accueil", LO.url.home], ["Questions fréquentes"]]));
LO.boutique({ action: "faq" }).then((d) => {
  const list = d.faqs || [];
  $("#faq").replaceChildren(...list.map((f, i) => el("details", { open: i === 0 ? "" : null }, el("summary", { text: f.question }), el("div", { class: "a", text: f.answer }))));
  if (list.length) LO.jsonLd({ "@context": "https://schema.org", "@type": "FAQPage", mainEntity: list.map((f) => ({ "@type": "Question", name: f.question, acceptedAnswer: { "@type": "Answer", text: f.answer } })) });
  if (!list.length) $("#faq").replaceChildren(el("div", { class: "empty", text: "Aucune question pour le moment." }));
}).catch(() => $("#faq").replaceChildren(el("div", { class: "empty", text: "Erreur de chargement." })));
</script>
</body>
</html>
